name: Build CanHacker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CanHacker_Android_Start/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd CanHacker_Android_Start
          gradle assembleDebug --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CanHacker-APK
          path: CanHacker_Android_Start/app/build/outputs/apk/debug/*.apk
