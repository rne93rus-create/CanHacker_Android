plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.canhacker.start'
    compileSdk 35

    defaultConfig {
        applicationId 'com.canhacker.start'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}
