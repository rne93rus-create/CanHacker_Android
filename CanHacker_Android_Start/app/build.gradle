plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.canhacker.start'
    compileSdk 35

    defaultConfig {
        applicationId 'com.canhacker.start'
        minSdk 23
        targetSdk 28
        versionCode 1323
        versionName '1.3.23'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}
